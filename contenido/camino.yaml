            titulo: Ley de Ohm
            nodos:
              - { tipo: leccion, leccion: ohm-01 }
              - { tipo: leccion, leccion: ohm-02 }
              - { tipo: repaso }
              - { tipo: cofre }
              - { tipo: evaluacion }

