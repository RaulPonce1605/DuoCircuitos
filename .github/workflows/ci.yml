name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: circuitos
          POSTGRES_PASSWORD: circuitos
          POSTGRES_DB: circuitos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U circuitos -d circuitos"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Credenciales de la base desechable del CI, no son secretos reales.
      POSTGRES_USER: circuitos
      POSTGRES_PASSWORD: circuitos
      POSTGRES_DB: circuitos
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      JWT_SECRET: solo-para-ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Migraciones aplican y coinciden con los modelos
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  contenido:
    name: Temario (formato y fórmulas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run python -m app.content_import.validate

  app:
    name: App (lint, tipos y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: El cliente de src/api coincide con backend/openapi.json
        run: |
          npm run api:generate
          git diff --exit-code -- src/api || (echo "::error::Corre 'npm run api:generate' y commitea src/api" && exit 1)
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
