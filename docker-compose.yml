# Infraestructura local: PostgreSQL + backend.
# Las credenciales salen de backend/.env (copia backend/.env.example). Aquí no vive nada secreto.
#   docker compose up -d db        solo la base (el backend corre con uv en tu máquina)
#   docker compose up --build      base + backend en http://localhost:8000

services:
  db:
    image: postgres:17-alpine
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
